<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
</head>

<body>
    <main id="app">
        <div class="todo-app">
            <div class="task-head">
            <h1>TaskFlow</h1>

            </div>
            <div class="task-container">
                <div class="task-form">
                    <input placeholder="Task title*" type="text">
                    <input placeholder="Description (optional)" type="text">
                    <select name="" id="">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                    <input type="text">
                    <button></button>
                </div>
                <div class="tasks-list">
                    <div class="task-item">
                        <div>
                            <input type="checkbox">
                            <div>
                                <h3>Finish project documentation</h3>
                                <span>Update the README and add setup instructions</span>
                            </div>
                        </div>

                    </div>
                    <div class="task-item"></div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="/main.ts"></script>
</body>

</html>
